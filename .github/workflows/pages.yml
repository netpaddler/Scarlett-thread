name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site/data _site/vendor _site/fonts _site/config
          cp index.html styles.css app.js favicon.svg _site/
          cp config/requests.js _site/config/
          cp data/advent-graph.json data/sermons.json data/confessions.json data/deeper.json _site/data/
          cp vendor/cytoscape.min.js vendor/dagre.min.js _site/vendor/
          cp fonts/source-serif-4-latin.woff2 fonts/OFL.txt _site/fonts/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
